    <script>
      // Compatibility shim for browser extensions monkey-patching window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var currentFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}

        // Intercept unhandled extension script errors to prevent disruption
        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
